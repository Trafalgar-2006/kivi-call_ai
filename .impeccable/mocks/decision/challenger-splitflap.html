<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;width:390px;height:844px;overflow:hidden;background:#101214;font-family:Roboto,sans-serif;color:#f2f2f2}
.top{padding:14px 20px 6px;font:500 22px Roboto}
.hero{margin:8px 14px;background:#1a1d21;border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center}
.ele{width:96px;height:96px;border-radius:50%;background:#6d7780;flex:none}
.flap{display:inline-block;background:#050505;color:#fff;font:700 30px 'Roboto Condensed';width:24px;text-align:center;margin-right:2px;border-radius:3px;border-bottom:2px solid #333}
.sub{font-size:14px;margin-top:8px;color:#f5b041}
h3{font:500 13px Roboto;letter-spacing:1px;margin:20px 20px 8px;color:#8a9199}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px}
.m{height:64px;border-radius:12px;background:#1a1d21;padding:10px;font:500 15px Roboto}.m.on{background:#f5b041;color:#101214}
.board{margin:0 14px;background:#050505;border-radius:12px;padding:6px 10px}
.row{display:grid;grid-template-columns:58px 1fr 72px;gap:6px;padding:10px 0;border-bottom:1px solid #222;font:500 15px 'Roboto Condensed';text-transform:uppercase}
.row .s{color:#f5b041;text-align:right}.row .s.b{color:#d9534f}.row small{display:block;font:400 13px Roboto;text-transform:none;color:#9aa0a6}
</style></head><body>
<div class="top">Kivi</div>
<div class="hero"><div class="ele"></div><div><div><span class="flap">S</span><span class="flap">L</span><span class="flap">E</span><span class="flap">E</span><span class="flap">P</span></div><div class="sub">Answering everyone until 6:30 AM</div></div></div>
<h3>MODES</h3>
<div class="modes"><div class="m on">Sleep</div><div class="m">Busy</div><div class="m">Drive</div><div class="m">Away</div><div class="m">Strangers</div></div>
<h3>ARRIVALS</h3>
<div class="board">
<div class="row"><span>06:42</span><span>Ravi Kumar<small>Courier at the gate</small></span><span class="s">NEEDS YOU</span></div>
<div class="row"><span>23:05</span><span>Amma<small>Call back before leaving</small></span><span class="s">NEEDS YOU</span></div>
<div class="row"><span>21:10</span><span>+91 98480 2…<small>Loan offer</small></span><span class="s b">BLOCKED</span></div>
<div class="row"><span>18:30</span><span>Swiggy<small>Order delivered</small></span><span class="s">HANDLED</span></div>
</div>
</body></html>
